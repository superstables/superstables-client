# Every push and pull request is type-checked, tested, built and packed. The bundle is built in
# CI and not only at release time, because a manifest that no longer matches the code is a
# failure people only notice when they try to install it.
#
# The tests never reach the network (they stand up their own servers on loopback), so CI needs
# no keys, no funded wallet and no facilitator.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle
        run: npm run bundle

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: superstables-mcpb-node${{ matrix.node }}
          path: build/*.mcpb
          if-no-files-found: error
